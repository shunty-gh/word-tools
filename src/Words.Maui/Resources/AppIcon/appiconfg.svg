<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    <!--
        Pattern Lens foreground. The outer ring reads as search; its handle resolves into
        a fountain-pen nib. All detail remains inside the platform icon safe area.
    -->
    <circle cx="220" cy="210" r="122" fill="#14161A" stroke="#F2F3F5" stroke-width="28" />

    <!-- Crossword cells. The blue final cell is the pattern that has just been found. -->
    <g fill="#F2F3F5">
        <rect x="154" y="144" width="38" height="38" rx="4" />
        <rect x="201" y="144" width="38" height="38" rx="4" />
        <rect x="248" y="144" width="38" height="38" rx="4" />
        <rect x="154" y="191" width="38" height="38" rx="4" />
        <rect x="201" y="191" width="38" height="38" rx="4" />
        <rect x="248" y="191" width="38" height="38" rx="4" />
        <rect x="154" y="238" width="38" height="38" rx="4" />
        <rect x="201" y="238" width="38" height="38" rx="4" />
    </g>
    <rect x="248" y="238" width="38" height="38" rx="4" fill="#2A4B8D" />

    <!-- White connector and nib stay legible against the blue icon background. -->
    <path d="M296 306 L316 286 L366 336 L409 353 L432 422 L363 399 L346 356 Z" fill="#F2F3F5" />
    <circle cx="386" cy="376" r="8" fill="#2A4B8D" />
    <path d="M392 382 L419 409" fill="none" stroke="#2A4B8D" stroke-width="7" stroke-linecap="round" />
</svg>
