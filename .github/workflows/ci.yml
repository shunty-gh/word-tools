name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Catches packaging regressions without waiting for a release run. The AOT publish
      # is not built here: it needs a per-platform runner and several minutes.
      - name: Pack
        run: dotnet pack src/Words.Cli -c Release -o nupkg
