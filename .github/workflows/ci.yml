name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Everything that is not platform-specific. Builds the CLI, which pulls in the engine and
  # the lexicon builder, rather than the whole solution — the MAUI app cannot be built here.
  core:
    name: engine, CLI and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/Words.Cli

      - name: Test
        run: |
          for project in tests/*.Tests; do
            echo "::group::$project"
            dotnet test "$project"
            echo "::endgroup::"
          done

      # Catches packaging regressions without waiting for a release run. The AOT publish
      # is not built here: it needs a per-platform runner and several minutes.
      - name: Pack
        run: dotnet pack src/Words.Cli -c Release -o nupkg

  # Both of the app's targets need macOS to build. Add a matrix entry whenever a platform is
  # added to the project's TargetFrameworks — Android would build here too, Windows would
  # need its own runner.
  maui:
    name: MAUI (${{ matrix.framework }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net10.0-maccatalyst, net10.0-ios]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # setup-dotnet lays down its own SDK, which has no workloads installed — the ones on
      # the runner image belong to the image's SDK, so the build fails with NETSDK1147
      # without this.
      #
      # `restore` rather than installing this leg's workload alone, because restore spans
      # every framework the project lists whichever one is being built: a Mac Catalyst build
      # still evaluates the iOS target and demands the iOS workload. Narrowing the project
      # with -p:TargetFrameworks would fix that and cannot be used — a global property
      # reaches referenced projects too, and Words.Core is net10.0.
      - name: Install workloads
        run: dotnet workload restore src/Words.Maui/Words.Maui.csproj

      - name: Build
        run: dotnet build src/Words.Maui -f ${{ matrix.framework }}
