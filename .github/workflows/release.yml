name: Release

# Builds the distributable artefacts. NativeAOT cannot cross-compile, so each platform's
# binary is built on a runner of that platform — that is what the matrix is for, not
# parallelism.
#
# Two ways in, and they mean different things:
#
#   workflow_dispatch  a test build. Artefacts attach to the run and nothing is published,
#                      and the version in Words.Cli.csproj is left alone — so a dispatch
#                      build cannot be mistaken for a release.
#   push of a v* tag   a release. The tag sets the version, and the archives and the package
#                      are attached to a draft GitHub Release of that name.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The tag is the single source of truth for a release's version, so no file has to be kept
  # in step and no commit is needed to bump one. Words.Cli.csproj still carries a version,
  # which is what local builds and dispatch runs use.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
      android: ${{ steps.signing.outputs.android }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            # Empty means "leave the project's own version alone".
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets cannot be read in a job-level `if:`, so whether the app can be signed is
      # decided here and travels as an output. Without this, a fork — or this repo before
      # the keystore was added — would fail the release rather than simply not building an
      # APK. An unsigned APK is not worth producing: Android will not install one.
      - id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, so no Android APK will be built."
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  binaries:
    name: ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          # The Intel Mac leg. An arm64 runner cannot produce an x64 AOT binary, so this
          # needs a genuinely Intel runner; macos-13 was retired and no longer schedules at
          # all, which hangs the run rather than failing it.
          - os: macos-15-intel
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # NativeAOT on Linux links with clang and needs zlib's headers.
      - name: Install native toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Words.Cli -c Release -r ${{ matrix.rid }} \
            ${{ needs.version.outputs.version && format('-p:Version={0}', needs.version.outputs.version) || '' }} \
            -o "publish/${{ matrix.rid }}"

      # A smoke test, not a test run: proves this platform's binary starts, loads the
      # embedded lexicon and answers. `pattern` exits 0 only when something matched, and
      # `licence` proves the embedded licence texts survived AOT trimming.
      - name: Check it runs
        shell: bash
        run: |
          set -euo pipefail
          binary="publish/${{ matrix.rid }}/words"
          if [ -f "$binary.exe" ]; then
            binary="$binary.exe"
          fi
          "$binary" pattern RED.ERRING
          "$binary" licence > /dev/null

      # `words licence` prints the terms from inside the binary, but someone who downloads an
      # archive should not have to run a program to find out what they may do with it. Apache
      # 2.0 asks for the licence and the NOTICE to accompany what is distributed; for the
      # binaries, this step is what does it.
      - name: Stage the archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp LICENSE NOTICE README.md stage/
          if [ -f "publish/${{ matrix.rid }}/words.exe" ]; then
            cp "publish/${{ matrix.rid }}/words.exe" stage/
          elif [ -f "publish/${{ matrix.rid }}/words" ]; then
            cp "publish/${{ matrix.rid }}/words" stage/
          else
            echo "No binary was produced for ${{ matrix.rid }}." >&2
            exit 1
          fi
          ls -l stage

      # Compress-Archive rather than tar or 7z: it is part of PowerShell, so it is present on
      # every Windows runner including the arm64 one.
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath words-${{ matrix.rid }}.zip

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf words-${{ matrix.rid }}.tar.gz -C stage .

      - uses: actions/upload-artifact@v7
        with:
          name: words-${{ matrix.rid }}
          path: |
            words-${{ matrix.rid }}.tar.gz
            words-${{ matrix.rid }}.zip
          if-no-files-found: error

  tool:
    name: dotnet tool package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        run: >
          dotnet pack src/Words.Cli -c Release -o nupkg
          ${{ needs.version.outputs.version && format('-p:Version={0}', needs.version.outputs.version) || '' }}

      - uses: actions/upload-artifact@v7
        with:
          name: words-dotnet-tool
          path: nupkg/*.nupkg
          if-no-files-found: error

  # The Android app, signed and attached to the release like any other artefact. It builds on
  # macOS rather than Linux for a reason that is not about Android: `dotnet workload restore`
  # spans every framework Words.Maui lists, whichever one is being built, so a Linux runner
  # would be asked for the iOS workload and fail. Same constraint as the CI job — see the
  # comment there.
  #
  # Mac Catalyst is deliberately absent. Developer ID signing and notarisation are being
  # proven on a real Mac first (scripts/package-maccatalyst.sh); lifting them here afterwards
  # is mechanical, and guessing at them in CI is not.
  android:
    name: Android APK
    needs: version
    if: needs.version.outputs.android == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install workloads
        run: dotnet workload restore src/Words.Maui/Words.Maui.csproj

      - name: Decode the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/words.keystore"
          # Nothing here prints the keystore; its size is enough to show it decoded.
          wc -c < "$RUNNER_TEMP/words.keystore"

      # The passwords go through the environment rather than -p: arguments. MSBuild reads
      # environment variables as properties, and a -p: argument would be echoed into the log
      # by the runner before the step even starts.
      #
      # ApplicationVersion is Android's versionCode: an integer that must increase with every
      # build a device might be asked to upgrade to. The run number is the only monotonic
      # counter to hand — the tag is not one, since 0.2.0 and 0.10.0 do not order as integers.
      - name: Publish
        env:
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          dotnet publish src/Words.Maui -f net10.0-android -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/words.keystore" \
            -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -p:AndroidPackageFormats=apk \
            ${{ needs.version.outputs.version && format('-p:ApplicationDisplayVersion={0}', needs.version.outputs.version) || '' }} \
            -p:ApplicationVersion=${{ github.run_number }} \
            -o publish/android

      # The publish output carries the application id and a -Signed suffix; the release wants
      # a name a person can recognise. Fails loudly rather than shipping an unsigned APK.
      - name: Name the APK
        run: |
          set -euo pipefail
          apk=$(find publish/android -name '*-Signed.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "No signed APK was produced. Files present:" >&2
            find publish/android -name '*.apk' -o -name '*.aab' >&2 || true
            exit 1
          fi
          version='${{ needs.version.outputs.version }}'
          mv "$apk" "words${version:+-$version}-android.apk"
          ls -l words*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: words-android
          path: words*.apk
          if-no-files-found: error

  # Only on a tag. A dispatch run stops at the artefacts above, so the whole workflow can be
  # exercised without publishing anything.
  release:
    name: GitHub Release
    needs: [version, binaries, tool, android]
    # A skipped dependency would normally skip this job too, and `android` is skipped
    # whenever no keystore is configured — hence checking results explicitly rather than
    # relying on the default. A *failed* APK build does block the release: publishing one
    # that is quietly missing the app is worse than publishing nothing.
    if: >-
      !cancelled()
      && needs.version.outputs.release == 'true'
      && needs.binaries.result == 'success'
      && needs.tool.result == 'success'
      && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
      actions: read # to read this run's artefacts back
    steps:
      # `gh run download` rather than the download-artifact action: it pairs with whatever
      # uploaded the artefacts instead of having to track that action's major version.
      - name: Collect the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --dir artifacts
          # Downloads arrive one directory per artefact; the release wants a flat set of
          # files, and passing it a directory is an error.
          mkdir -p upload
          find artifacts -type f -exec mv -t upload/ {} +
          ls -l upload

      - name: Write the release notes
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Self-contained binaries — no .NET runtime needed. Unpack and run `words`.

          Or install it as a .NET global tool:

              dotnet tool install -g Shunty.Words

          The program is licensed under Apache 2.0. The bundled word lists are third-party
          and keep their own terms — `words licence` prints all of them, and LICENSE and
          NOTICE travel inside every archive.
          NOTES

      # Drafted rather than published: release notes deserve a read before anyone can
      # download them, and a tag can be pushed by accident. Publishing is one click in the
      # Releases tab.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            upload/*
